name: Build and optionally upload test release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version in release/releases (for example 1.4.3)
        required: true
        type: string
      platform:
        description: Platforms to build
        type: choice
        options: [both, android, ios]
        default: both
      upload:
        description: Upload to Google Play internal and/or TestFlight (never production)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Share this group with release-store.yml: Google Play edits must not overlap.
  group: release-store-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  preflight:
    name: Check reviewed release and explicit enablement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require deliberate pipeline enablement
        env:
          RELEASE_PIPELINE_ENABLED: ${{ vars.RELEASE_PIPELINE_ENABLED }}
        run: |
          if [ "$RELEASE_PIPELINE_ENABLED" != "true" ]; then
            echo "::error::Complete release/SETUP.md and explicitly enable RELEASE_PIPELINE_ENABLED before starting build jobs."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate every translation and export store formats
        run: python3 scripts/release.py export "$RELEASE_VERSION" --reviewed

  android:
    name: Android bundle and optional internal upload
    needs: preflight
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    environment: release-testing
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install the project's Android SDK
        run: sdkmanager "platform-tools" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Materialize existing Android signing and Firebase configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/release-ci.py android-build
      - name: Build the reviewed Android bundle
        env:
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: bundle exec fastlane android build_test "version:$RELEASE_VERSION"
      - name: Retain the bundle and its build receipt
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            build/release/${{ inputs.version }}/app.aab
            build/release/${{ inputs.version }}/android-build.json
            build/release/${{ inputs.version }}/mapping.txt
            build/release/${{ inputs.version }}/manifest.json
            build/release/${{ inputs.version }}/metadata/
          if-no-files-found: error
          retention-days: 7
      - name: Materialize Google Play upload credentials
        if: inputs.upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: python3 scripts/release-ci.py android-upload
      - name: Upload only to Google Play internal testing
        if: inputs.upload
        env:
          RELEASE_UPLOAD_CONFIRMED: internal
        run: bundle exec fastlane android upload_test "version:$RELEASE_VERSION"
      - name: Remove Android signing and upload credentials
        if: always()
        run: python3 scripts/release-ci.py cleanup

  ios:
    name: iOS archive and optional TestFlight upload
    needs: preflight
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-15
    environment: release-testing
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select the approved installed Xcode
        env:
          RELEASE_XCODE_DEVELOPER_DIR: ${{ vars.RELEASE_XCODE_DEVELOPER_DIR }}
        run: |
          if [ -n "$RELEASE_XCODE_DEVELOPER_DIR" ]; then
            test -d "$RELEASE_XCODE_DEVELOPER_DIR"
            echo "DEVELOPER_DIR=$RELEASE_XCODE_DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
      - name: Record the selected toolchain
        run: xcodebuild -version
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK for KMP Gradle configuration
        run: sdkmanager "platform-tools" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Materialize existing Apple distribution signing and Firebase configuration
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: python3 scripts/release-ci.py ios-build
      - name: Build the reviewed iOS archive
        run: bundle exec fastlane ios build_test "version:$RELEASE_VERSION"
      - name: Retain the IPA and its build receipt
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            build/release/${{ inputs.version }}/app.ipa
            build/release/${{ inputs.version }}/ios-build.json
            build/release/${{ inputs.version }}/manifest.json
            build/release/${{ inputs.version }}/metadata/
            build/release/${{ inputs.version }}/*.dSYM.zip
          if-no-files-found: error
          retention-days: 7
      - name: Materialize App Store Connect upload credentials
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/release-ci.py ios-upload
      - name: Upload only to TestFlight without external review
        if: inputs.upload
        env:
          RELEASE_UPLOAD_CONFIRMED: internal
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bundle exec fastlane ios upload_test "version:$RELEASE_VERSION"
      - name: Restore keychain state and remove Apple credentials
        if: always()
        run: python3 scripts/release-ci.py cleanup
