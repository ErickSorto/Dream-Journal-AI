name: Prepare, submit, or release a store version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed release version (for example 2.0.0)
        required: true
        type: string
      platform:
        description: Store to change
        required: true
        type: choice
        options: [android, ios]
      action:
        description: Separate store action (Android publish is Console-only)
        required: true
        type: choice
        options: [prepare, submit, publish]
        default: prepare
      confirmation:
        description: 'Type exactly <platform>:<action>:<version>, for example ios:prepare:2.0.0'
        required: true
        type: string
      google_attestation:
        description: 'For Android submit only: managed-publishing-on-no-unrelated-changes'
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Share this group with release-test.yml to serialize all store mutations.
# Never cancel a request whose store outcome might already have changed.
concurrency:
  group: release-store-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_PLATFORM: ${{ inputs.platform }}
  RELEASE_STORE_ACTION: ${{ inputs.action }}
  RELEASE_STORE_ACTION_CONFIRMED: ${{ inputs.confirmation }}
  RELEASE_GOOGLE_MANAGED_PUBLISHING_ATTESTATION: ${{ inputs.google_attestation }}
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"
  BUNDLE_FROZEN: "true"

jobs:
  preflight:
    name: Validate the requested action before any store access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require separate store-pipeline enablement
        env:
          RELEASE_STORE_PIPELINE_ENABLED: ${{ vars.RELEASE_STORE_PIPELINE_ENABLED }}
        run: |
          if [ "$RELEASE_STORE_PIPELINE_ENABLED" != "true" ]; then
            echo "::error::Store actions are disabled. Complete and authorize the store setup before enabling RELEASE_STORE_PIPELINE_ENABLED."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check exact confirmation and supported action
        run: python3 scripts/release-store-ci.py check
      - name: Validate the reviewed local store plan
        run: python3 scripts/release.py prepare "$RELEASE_VERSION" --platform "$RELEASE_PLATFORM" --stage "$RELEASE_STORE_ACTION" --reviewed

  store:
    name: Apply the separately approved store action
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.action == 'prepare' && 'release-store' || inputs.action == 'submit' && 'release-submission' || 'release-production' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Recheck the local plan after environment approval
        run: |
          python3 scripts/release-store-ci.py check
          python3 scripts/release.py prepare "$RELEASE_VERSION" --platform "$RELEASE_PLATFORM" --stage "$RELEASE_STORE_ACTION" --reviewed
      - name: Materialize only the existing Google Play API key
        if: inputs.platform == 'android'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: python3 scripts/release-store-ci.py android
      - name: Materialize only the existing App Store Connect API key
        if: inputs.platform == 'ios'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/release-store-ci.py ios
      - name: Run exactly the confirmed store action against the existing build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_REVIEW_DEMO_USER: ${{ inputs.platform == 'ios' && secrets.APP_REVIEW_DEMO_USER || '' }}
          APP_REVIEW_DEMO_PASSWORD: ${{ inputs.platform == 'ios' && secrets.APP_REVIEW_DEMO_PASSWORD || '' }}
        run: |
          case "$RELEASE_STORE_ACTION" in
            prepare) lane=prepare_store ;;
            submit) lane=submit_store ;;
            publish) lane=release_store ;;
            *) echo "::error::Unsupported store action"; exit 1 ;;
          esac
          bundle exec fastlane "$RELEASE_PLATFORM" "$lane" "version:$RELEASE_VERSION"
      # Store plans and review files may contain private review contact details.
      # Intentionally do not upload them, credential files, or entire output dirs.
      - name: Remove temporary API key files
        if: always()
        run: python3 scripts/release-store-ci.py cleanup
